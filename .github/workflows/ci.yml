# CI: lint, typecheck, tests (backend with PostgreSQL), OpenAPI snapshot, end-to-end flows
# (Playwright against the seeded API) and image builds.
# Syntax compatible with Forgejo Actions.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: prumo
          POSTGRES_PASSWORD: prumo
          POSTGRES_DB: prumo_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U prumo -d prumo_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PRUMO_TEST_DATABASE_URL: postgresql+psycopg://prumo:prumo@localhost:5433/prumo_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.6"
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run lint-imports
      - name: Typecheck
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: OpenAPI snapshot
        run: uv run prumo openapi - | diff -u ../openapi/openapi.json -

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: "12.15.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Generated API types
        run: |
          pnpm exec openapi-typescript ../openapi/openapi.json --default-non-nullable false \
            | pnpm exec prettier --stdin-filepath schema.d.ts \
            | diff -u src/lib/api/schema.d.ts -
      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: prumo
          POSTGRES_PASSWORD: prumo
          POSTGRES_DB: prumo_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U prumo -d prumo_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.6"
      - run: uv sync --frozen
        working-directory: backend
      - uses: pnpm/action-setup@v6
        with:
          version: "12.15.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: End-to-end flows
        run: pnpm exec playwright test e2e/flows.spec.ts
        working-directory: frontend

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -f deploy/api.Dockerfile -t prumo-api:ci .
      - name: Build web image
        run: docker build -f deploy/web.Dockerfile -t prumo-web:ci .
