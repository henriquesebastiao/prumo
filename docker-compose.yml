# Self-hosted Prumo: PostgreSQL, API and web (nginx). Only `web` is published (PRUMO_PORT).
# Configure through .env (copy .env.example). Images come from GHCR (PRUMO_VERSION, default
# latest); to build them from this checkout instead, add `-f docker-compose.build.yml`.
name: prumo

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prumo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-prumo}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ghcr.io/henriquesebastiao/prumo-api:${PRUMO_VERSION:-latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Overrides the localhost URL of .env, which is for `make dev`.
      PRUMO_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-prumo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-prumo}
      PRUMO_UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/henriquesebastiao/prumo-web:${PRUMO_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${PRUMO_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
  uploads:
